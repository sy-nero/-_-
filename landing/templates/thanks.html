<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תודה — {{ association_name }}</title>
  <style>
    body {
      margin: 0; font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1f3a5f 0%, #2e5a8f 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px; max-width: 460px; width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25); padding: 40px 30px; text-align: center;
    }
    .check {
      width: 72px; height: 72px; border-radius: 50%; background: #2e7d32;
      color: #fff; font-size: 40px; line-height: 72px; margin: 0 auto 20px;
    }
    h1 { color: #1f3a5f; margin: 0 0 12px; font-size: 24px; }
    p { color: #555; font-size: 16px; line-height: 1.7; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>תודה רבה!</h1>
    <p>פרטיכם התקבלו בהצלחה.<br>נציג מטעם {{ association_name }} יחזור אליכם בהקדם.</p>
  </div>
</body>
</html>
